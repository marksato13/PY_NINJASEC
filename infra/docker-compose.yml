services:
  postgres:
    image: postgres:16
    container_name: ninjasec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ninjasec}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ninjasec}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ninjasec-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME:                    ${APP_NAME:-NinjaSec}
      APP_VERSION:                 ${APP_VERSION:-0.2.0}
      API_PREFIX:                  ${API_PREFIX:-/api/v1}
      DATABASE_URL:                postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-ninjasec}
      JWT_SECRET_KEY:              ${JWT_SECRET_KEY:?JWT_SECRET_KEY requerido en .env}
      JWT_ALGORITHM:               ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS:                ${CORS_ORIGINS:-http://localhost:3018}
      SEED_ON_STARTUP:             ${SEED_ON_STARTUP:-true}
      IS_PRODUCTION:               ${IS_PRODUCTION:-false}
    ports:
      - "8024:8024"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8024/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: ninjasec-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8024}
    ports:
      - "3018:3018"

volumes:
  postgres_data:
